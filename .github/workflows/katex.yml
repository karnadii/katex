name: katex_dart (pure Dart)

on:
  push:
    paths:
      - "packages/katex_dart/**"
      - ".github/workflows/katex.yml"
  pull_request:
    paths:
      - "packages/katex_dart/**"
      - ".github/workflows/katex.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/katex_dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test

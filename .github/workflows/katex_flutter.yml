name: katex (Flutter)

on:
  push:
    paths:
      - "packages/katex/**"
      - "packages/katex_dart/**"
      - ".github/workflows/katex_flutter.yml"
  pull_request:
    paths:
      - "packages/katex/**"
      - "packages/katex_dart/**"
      - ".github/workflows/katex_flutter.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/katex
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
